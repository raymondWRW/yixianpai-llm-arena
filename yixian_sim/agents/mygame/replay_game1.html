<title>林小月 弈仙牌 Replay</title>
<style>
:root{--bg:#0c1f2a;--bg2:#123240;--panel:#0f2833;--gold:#c9a45c;--gold2:#8a6c33;--parch:#ece3cc;--parch2:#dfd3b4;
--ink:#2a2418;--tx:#d8e4e8;--dim:#7fa0ab;--teal:#2e6e7e;--win:#5fc793;--loss:#e0705a;--glow:#ffd76a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%, #1b4254 0%, var(--bg) 55%) fixed, var(--bg);
color:var(--tx);font:14px/1.45 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px 6px;gap:12px;flex-wrap:wrap}
.plaques{display:flex;gap:10px;flex-wrap:wrap}
.plaque{background:linear-gradient(#16323e,#0e2530);border:1px solid var(--gold2);border-radius:6px;
padding:6px 14px;min-width:96px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.plaque small{display:block;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.plaque b{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;
font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif}
.roundbox{text-align:right}
.roundbox .rn{font:600 26px/1.1 "Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;color:var(--gold)}
.roundbox .mv{color:var(--dim);font-variant-numeric:tabular-nums}
.banner{margin:4px auto 0;max-width:900px;width:calc(100% - 36px);text-align:center;
background:rgba(9,26,34,.82);border:1px solid var(--gold2);border-radius:8px;padding:8px 16px;min-height:56px}
.banner .act{font:600 17px/1.3 "Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;color:var(--gold)}
.banner .act.win{color:var(--win)} .banner .act.loss{color:var(--loss)}
.banner .act.deal{color:var(--win)} .banner .act.fx{color:#f0c56a}
.card.dealt{outline:3px solid var(--win);outline-offset:1px;box-shadow:0 0 18px rgba(95,199,147,.5)}
.banner .sub{color:var(--dim);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.board{display:flex;justify-content:center;gap:10px;padding:16px 14px;flex-wrap:wrap}
.slot{width:118px;height:168px;border-radius:8px;position:relative;flex:0 0 auto}
.slot.empty{border:1px dashed rgba(201,164,92,.35);background:rgba(255,255,255,.02)}
.slot.locked{border:1px dashed rgba(127,160,171,.18);background:rgba(0,0,0,.15)}
.slot.locked::after{content:"锁";position:absolute;inset:0;display:grid;place-items:center;color:rgba(127,160,171,.3);
font-size:22px;font-family:"Songti SC","SimSun",serif}
.slot .num{position:absolute;top:-9px;left:-6px;z-index:2;width:20px;height:20px;border-radius:50%;
background:var(--gold);color:#20180a;font:700 11px/20px sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.card{width:100%;height:100%;border-radius:8px;background:linear-gradient(#f2ead4,var(--parch2));
border:2px solid var(--gold2);color:var(--ink);padding:8px 7px;display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.card .nm{font:600 15px/1.25 "Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;text-wrap:balance}
.card .lv{margin-top:auto;align-self:flex-end;background:var(--teal);color:#eaf6f8;border-radius:4px;
font:700 11px/1 sans-serif;padding:3px 6px}
.card.hl{outline:3px solid var(--glow);outline-offset:1px;box-shadow:0 0 18px rgba(255,215,106,.55)}
.bottom{margin-top:auto;display:grid;grid-template-columns:210px 1fr 130px;gap:12px;align-items:end;
padding:10px 18px 14px;background:linear-gradient(transparent,rgba(5,15,20,.85) 30%)}
.fates{background:rgba(9,26,34,.8);border:1px solid rgba(201,164,92,.4);border-radius:8px;padding:10px 12px}
.fates .who{font:600 18px/1.2 "Songti SC","STSong","SimSun","Noto Serif CJK SC",Georgia,serif;color:var(--gold)}
.fates .job{color:var(--dim);font-size:12px;margin-bottom:6px}
.fates ul{list-style:none;margin:0;padding:0;font-size:12.5px}
.fates li{padding:1px 0;border-bottom:1px dotted rgba(127,160,171,.25)}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap;min-height:120px}
.hand .slot{width:92px;height:130px}
.hand .card .nm{font-size:13px}
.rolls{background:rgba(9,26,34,.8);border:1px solid rgba(201,164,92,.4);border-radius:8px;padding:10px;text-align:center}
.rolls small{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em}
.rolls b{font-size:30px;color:var(--gold);font-family:"Songti SC","SimSun",serif}
.nav{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 16px 18px;background:rgba(5,15,20,.85)}
.nav button{background:linear-gradient(#1a3a48,#102b36);border:1px solid var(--gold2);color:var(--gold);
font:600 15px/1 "Songti SC","SimSun",serif;padding:10px 22px;border-radius:6px;cursor:pointer}
.nav button:hover{background:#1f4656} .nav button:focus-visible{outline:2px solid var(--glow)}
.nav button:disabled{opacity:.35;cursor:default}
.nav input[type=range]{flex:1;max-width:520px;accent-color:var(--gold)}
.stand{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:12px;
padding:0 16px 6px;background:rgba(5,15,20,.85);font-variant-numeric:tabular-nums}
.stand b{color:var(--tx);margin-left:3px} .stand .me b{color:var(--gold)}
.stand .dead{text-decoration:line-through;opacity:.55}
kbd{background:#16323e;border:1px solid var(--gold2);border-radius:3px;padding:0 5px;font-size:11px;color:var(--dim)}
@media (max-width:820px){.bottom{grid-template-columns:1fr}.rolls{justify-self:start}}
</style>

</div>

const OPPS = ["曜灵", "叶冥冥", "屠馗", "陆剑心", "吾行之", "南宫生", "龙瑶"];
const NAMES = {0:"林小月"}; OPPS.forEach((n,i)=>NAMES[i+1]=n);
let i = 0;
const $ = id => document.getElementById(id);
function baseLv(n){ const m = n.match(/^(.*?)\+(\d)$/); return m ? [m[1], +m[2]+1] : [n, 1]; }
function cardEl(name, hl, num, cls){
  const [b, lv] = baseLv(name);
  const s = document.createElement('div'); s.className = 'slot';
  if(num !== undefined){ const d = document.createElement('div'); d.className='num'; d.textContent=num; s.appendChild(d); }
  const c = document.createElement('div'); c.className = 'card' + (hl ? (cls === 'deal' ? ' dealt' : ' hl') : '');
  const nm = document.createElement('div'); nm.className='nm'; nm.textContent = b;
  c.appendChild(nm);
  if(lv > 1){ const l = document.createElement('div'); l.className='lv'; l.textContent = 'Lv' + lv; c.appendChild(l); }
  s.appendChild(c); return s;
}
function render(){
  const m = MOVES[i];
  $('rnd').textContent = m.round; $('mv').textContent = i + 1;
  $('cult').textContent = m.cult; $('hp').textContent = m.hp;
  $('dest').textContent = m.destiny; $('realm').textContent = m.realm;
  $('rr').textContent = m.rerolls;
  const act = $('act');
  act.textContent = m.text; act.className = 'act';
  if(m.type === 'battle'){ if(m.text.startsWith('WIN')) act.classList.add('win'); if(m.text.startsWith('LOSS')) act.classList.add('loss'); }
  if(m.type === 'deal' || m.type === 'fx') act.classList.add(m.type);
  $('sub').textContent = m.sub || '';
  const unlocked = m.slots ?? Math.min(8, Math.max(3, m.round + 2));
  const bd = $('board'); bd.replaceChildren();
  for(let k = 0; k < 8; k++){
    if(k < m.board.length){ bd.appendChild(cardEl(m.board[k], m.hlB.includes(k), k + 1)); }
    else { const s = document.createElement('div'); s.className = 'slot ' + (k < unlocked ? 'empty' : 'locked'); bd.appendChild(s); }
  }
  const hd = $('hand'); hd.replaceChildren();
  m.hand.forEach((c, k) => hd.appendChild(cardEl(c, m.hlH.includes(k), undefined, m.type)));
  if(!m.hand.length){ const e = document.createElement('div'); e.style.color='var(--dim)'; e.textContent='(hand empty)'; hd.appendChild(e); }
  const fl = $('fates'); fl.replaceChildren();
  m.talents.forEach(t => { const li = document.createElement('li'); li.textContent = t; fl.appendChild(li); });
  const st = $('stand'); st.replaceChildren();
  if(m.standings){
    Object.entries(m.standings).sort((a,b)=>b[1]-a[1]).forEach(([pid,v])=>{

      sp.className = (pid==='0'?'me ':'') + (v===0?'dead':'');
      sp.textContent = NAMES[pid] ?? ('pid'+pid); const b = document.createElement('b'); b.textContent = v;
      sp.appendChild(b); st.appendChild(sp);
    });
  }
  $('scrub').value = i;
  $('prev').disabled = i === 0; $('next').disabled = i === MOVES.length - 1;
}
function go(n){ i = Math.max(0, Math.min(MOVES.length - 1, n)); render(); }
$('prev').onclick = () => go(i - 1);
$('next').onclick = () => go(i + 1);
$('scrub').oninput = e => go(+e.target.value);
addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft'){ go(i - 1); e.preventDefault(); }
  if(e.key === 'ArrowRight'){ go(i + 1); e.preventDefault(); }
});
render();
</script>
